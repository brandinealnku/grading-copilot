<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ITSBAD Grading Copilot</title><style>body{font-family:system-ui;margin:0;background:#f6f7f9;color:#15171a}main{max-width:900px;margin:auto;padding:48px 24px}.card{background:white;padding:26px;border-radius:16px;box-shadow:0 1px 8px #0001}select{width:100%;padding:12px;margin:8px 0 20px}button{padding:12px 18px;font-weight:700}</style></head><body><main><b>ITSBAD LABS</b><h1>Grading Copilot</h1><p>Review-first Canvas grading. Writes remain disabled during setup.</p><div class="card"><p id="status">Checking Canvas connection…</p><b>Course</b><select id="course"><option>Select a course…</option></select><b>Assignment</b><select id="assignment" disabled><option>Select an assignment…</option></select><p id="next"></p><button disabled>Post Approved Grades to Canvas — Disabled</button></div></main><script>
const statusEl=document.querySelector("#status"),course=document.querySelector("#course"),assignment=document.querySelector("#assignment");
async function get(path){const r=await fetch(path),j=await r.json();if(!j.ok)throw new Error(j.error);return j.data;}
(async()=>{try{const s=await get("/api/status");statusEl.textContent=`Connected to ${s.canvasHost} · writes ${s.writesEnabled?"enabled":"disabled"}`;const cs=await get("/api/courses");course.innerHTML='<option value="">Select a course…</option>'+cs.map(c=>`<option value="${c.id}">${c.name}</option>`).join("");}catch(e){statusEl.textContent="Canvas setup needed · "+e.message;}})();
course.onchange=async()=>{assignment.disabled=true;assignment.innerHTML='<option>Loading…</option>';if(!course.value)return;try{const as=await get(`/api/courses/${course.value}/assignments`);assignment.innerHTML='<option value="">Select an assignment…</option>'+as.map(a=>`<option value="${a.id}">${a.name} · ${a.points_possible??"—"} pts</option>`).join("");assignment.disabled=false;}catch(e){assignment.innerHTML='<option>Error loading assignments</option>';}};
assignment.onchange=()=>{document.querySelector("#next").textContent=assignment.value?"Next: load submissions, match proposed grades and feedback, and build the approval queue.":"";};
</script></body></html>
